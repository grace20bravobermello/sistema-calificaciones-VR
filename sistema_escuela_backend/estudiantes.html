<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Estudiantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">👤 Gestión de Estudiantes</h1>
            <a href="index.html" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                ← Volver a Notas
            </a>
        </div>

        <!-- Formulario para agregar -->
        <form id="formEstudiante" class="flex gap-4 mb-6">
            <input type="text" id="nombre" placeholder="Nombre" required class="border p-2 rounded w-full">
            <input type="text" id="apellido" placeholder="Apellido" required class="border p-2 rounded w-full">
            <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition font-bold">
                Agregar
            </button>
        </form>

        <!-- Tabla de Estudiantes -->
        <table class="w-full text-left border-collapse border border-gray-200">
            <thead>
                <tr class="bg-gray-200">
                    <th class="p-3 border">ID</th>
                    <th class="p-3 border">Nombre</th>
                    <th class="p-3 border">Apellido</th>
                    <th class="p-3 border text-center">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaEstudiantes">
                <!-- Se cargan dinámicamente -->
            </tbody>
        </table>
    </div>

    <script>
    const API_URL = '';

    async function cargarEstudiantes() {
        try {
            const res = await fetch(`${API_URL}/estudiantes`);
            if (!res.ok) throw new Error("Error al obtener estudiantes");
            const datos = await res.json();
            
            const tbody = document.getElementById('tablaEstudiantes');
            tbody.innerHTML = '';
            
            if (datos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400 italic">No hay estudiantes registrados aún.</td></tr>`;
                return;
            }

            datos.forEach(est => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 border text-center font-mono">${est.id_estudiante}</td>
                        <td class="p-3 border font-semibold">${est.nombre}</td>
                        <td class="p-3 border font-semibold">${est.apellido}</td>
                        <td class="p-3 border text-center">
                            <button onclick="eliminarEstudiante(${est.id_estudiante})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition cursor-pointer">
                                🗑️ Eliminar
                            </button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error("Error al cargar lista:", error);
        }
    }

    document.getElementById('formEstudiante').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nombre = document.getElementById('nombre').value.trim();
        const apellido = document.getElementById('apellido').value.trim();

        if (!nombre || !apellido) {
            alert("Por favor, llena tanto el nombre como el apellido.");
            return;
        }

        try {
            const res = await fetch(`${API_URL}/estudiantes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, apellido })
            });

            const data = await res.json();

            if (res.ok) {
                alert(data.mensaje || "✅ Estudiante agregado correctamente");
                document.getElementById('nombre').value = '';
                document.getElementById('apellido').value = '';
                await cargarEstudiantes(); // Recarga la tabla de inmediato
            } else {
                alert("⚠️ El servidor respondió con un error: " + (data.error || "No se pudo guardar"));
            }
        } catch (error) {
            console.error("Error al enviar formulario:", error);
            alert("❌ Error de conexión al guardar el estudiante.");
        }
    });

    async function eliminarEstudiante(id) {
        if (confirm('¿Seguro que deseas eliminar a este estudiante?')) {
            try {
                const res = await fetch(`${API_URL}/estudiantes/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (res.ok) {
                    alert(data.mensaje || "Estudiante eliminado correctamente.");
                    await cargarEstudiantes();
                } else {
                    alert("Error al eliminar: " + (data.error || "No se pudo procesar"));
                }
            } catch (error) {
                console.error("Error al eliminar:", error);
                alert("Error de conexión al intentar eliminar.");
            }
        }
    }

    document.addEventListener('DOMContentLoaded', cargarEstudiantes);
</script>
</body>
</html>
